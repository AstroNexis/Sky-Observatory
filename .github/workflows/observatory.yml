name: Observatory Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - 'release/**'
    paths:
      - 'sky-observatory/**'
      - 'api/**'
      - 'engine/**'
      - 'native/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  pull_request:
    branches:
      - master
      - main
      - 'release/**'
    paths:
      - 'sky-observatory/**'
      - 'api/**'
      - 'engine/**'
      - 'native/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

concurrency:
  group: observatory-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
  JAVA_VERSION: "17"
  NDK_VERSION: "27.2.12479018"

jobs:
  renderer-build:
    name: Build observatory
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.NDK_VERSION }}"

      - run: chmod +x gradlew

      - run: |
          JAR=gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "$JAR" ]; then
            curl -fsSL -o /tmp/gradle-bin.zip \
              "https://services.gradle.org/distributions/gradle-9.7.0-bin.zip"
            unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-install
            /tmp/gradle-install/gradle-9.7.0/bin/gradle \
              -p "$(pwd)" wrapper --gradle-version 9.7.0
            rm -rf /tmp/gradle-install /tmp/gradle-bin.zip
          fi

      - name: Build SDK artifacts
        run: ./gradlew :api:assembleDebug :engine:assembleDebug :native:assembleDebug --stacktrace

      - name: Build observatory APKs
        run: ./gradlew :sky-observatory:assembleDebug :sky-observatory:assembleRelease --stacktrace

      - name: Verify APK outputs
        run: |
          shopt -s nullglob
          debug_apks=(sky-observatory/build/outputs/apk/debug/*.apk)
          release_apks=(sky-observatory/build/outputs/apk/release/*.apk)
          if [ "${#debug_apks[@]}" -eq 0 ]; then
            echo "::error::Debug APK not found at expected path"
            exit 1
          fi
          if [ "${#release_apks[@]}" -eq 0 ]; then
            echo "::error::Release APK not found at expected path"
            exit 1
          fi
          {
            echo "### Unsigned APKs"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in "${debug_apks[@]}" "${release_apks[@]}"; do
            size=$(du -h "$apk" | cut -f1)
            sha=$(sha256sum "$apk" | cut -d' ' -f1)
            echo "APK: $(basename "$apk")  size: $size  sha256: $sha"
            echo "| $(basename "$apk") | $size | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Resolve apksigner path
        run: |
          APK_SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APK_SIGNER" ]; then
            echo "::error::apksigner not found in build-tools"
            exit 1
          fi
          echo "APK_SIGNER=$APK_SIGNER" >> $GITHUB_ENV

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks

      - name: Sign release APKs (v1+v2+v3)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          for apk in sky-observatory/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            $APK_SIGNER sign \
              --ks /tmp/keystore.jks \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-type JKS \
              "$apk"
          done

      - name: Verify APK signatures
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          for apk in sky-observatory/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            $APK_SIGNER verify --verbose "$apk" 2>&1 | \
              grep -E "Verified using v1 scheme|Verified using v2 scheme|Verified using v3 scheme"
          done

      - name: Print signed APK details
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          shopt -s nullglob
          apks=(sky-observatory/build/outputs/apk/release/*.apk)
          {
            echo "### Signed release APK"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in "${apks[@]}"; do
            size=$(du -h "$apk" | cut -f1)
            sha=$(sha256sum "$apk" | cut -d' ' -f1)
            echo "APK: $(basename "$apk")  size: $size  sha256: $sha"
            echo "| $(basename "$apk") | $size | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Run SDK tests
        run: ./gradlew :api:test :engine:test :native:test --stacktrace

      - name: Package debug and release APKs
        run: |
          shopt -s nullglob
          debug_apks=(sky-observatory/build/outputs/apk/debug/*.apk)
          release_apks=(sky-observatory/build/outputs/apk/release/*.apk)
          if [ "${#debug_apks[@]}" -eq 0 ] || [ "${#release_apks[@]}" -eq 0 ]; then
            echo "::error::Cannot package, one or both APK sets are missing"
            exit 1
          fi
          mkdir -p dist
          rm -f dist/observatory-debug.zip dist/observatory-release.zip
          zip -j dist/observatory-debug.zip "${debug_apks[@]}"
          zip -j dist/observatory-release.zip "${release_apks[@]}"
          {
            echo "### Packaged builds"
            echo ""
            echo "| Zip | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            for z in dist/observatory-debug.zip dist/observatory-release.zip; do
              size=$(du -h "$z" | cut -f1)
              sha=$(sha256sum "$z" | cut -d' ' -f1)
              echo "| $(basename "$z") | $size | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          unzip -l dist/observatory-debug.zip
          unzip -l dist/observatory-release.zip

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: observatory-debug
          path: dist/observatory-debug.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: observatory-release
          path: dist/observatory-release.zip
          if-no-files-found: error
          retention-days: 14
